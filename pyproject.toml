[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "beeref.constants.VERSION"}

[tool.setuptools.packages.find]
include = ["beeref*"]

[tool.setuptools.package-data]
# .txt is here for the font licence that has to travel with the Ranade
# files in beeref/assets/fonts. Without it an installed copy has the
# fonts but not their licence.
"*" = ["*.html", "*.png", "*.svg", "*.otf", "*.ttf", "*.txt", "*.hex"]

[project]
name = "Blackboard"
# Read from beeref/constants.py so the version can never drift between the
# two files. See [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "A simple reference image viewer (personal fork of BeeRef)"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
    { name = "Rebecca Breu", email = "rebecca@rbreu.de" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "exif>=1.3.5,<=1.6.0",
    "lxml==5.1.0",
    "pyQt6-Qt6>=6.7.0,<=6.7.0",
    "pyQt6>=6.7.0,<=6.7.0",
    "rectangle-packer>=2.0.1,<=2.0.2",
]

[project.gui-scripts]
beeref = "beeref.__main__:main"

[project.urls]
Homepage = "https://beeref.org/"
Repository = "https://github.com/rbreu/beeref"
# Documentation =
Issues = "https://github.com/rbreu/beeref/issues"
Changelog = "https://github.com/rbreu/beeref/blob/main/CHANGELOG.rst"